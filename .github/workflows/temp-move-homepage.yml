name: Temporary move homepage to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded homepage to index.html
        run: |
          test -f digitalskillguide.html
          mv digitalskillguide.html index.html
          ls -l index.html
          grep -m1 "G-XB2F0QNCRS" index.html
      - name: Commit index.html
        run: |
          git config user.name "baigsmail786-python"
          git config user.email "baigsmail786-python@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace index.html with updated homepage containing GA tag G-XB2F0QNCRS"
          git push
