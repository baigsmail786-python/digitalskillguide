name: _tmp-move-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move patched file to index.html and commit
        run: |
          mv digitalskillguide.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with patched version (scrollRestoration fix)"
          git push
