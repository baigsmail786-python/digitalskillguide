name: Move temp homepage to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp homepage to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.amazon.com"
          mv -f digitalskillguide.html index.html
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish new homepage"
            git push
          fi
